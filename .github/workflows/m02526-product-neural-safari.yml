name: m025-26 product neural Safari proof

# Proves the live hybrid product runtime on real Safari arm64. In m025-49 Puter cloud is
# the primary online provider; this signed-out CI runner therefore exercises the automatic
# Supertonic offline fallback: neural audio works, no browser TTS is substituted, the local
# engine downloads exactly once, reload re-downloads nothing, and inference never crashes
# or latches the circuit. Puter <2s/voice-quality acceptance remains a signed-in physical
# device gate because CI has no OWNER Puter session.
on:
  push:
    branches: [master/m02526-sherpa-vits-engine, main]
  pull_request:
    paths:
      - 'features/neural-voice/**'
      - '.github/workflows/m02526-product-neural-safari.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safari26:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Record Apple Safari substrate
        shell: bash
        run: |
          set -euo pipefail
          sw_vers | tee m02526-sw-vers.txt
          /usr/bin/safaridriver --version | tee m02526-safaridriver-version.txt
          arch="$(/usr/bin/arch)"; echo "$arch" | tee m02526-arch.txt; test "$arch" = arm64

      - name: Verify vendored engine bytes
        shell: bash
        run: |
          set -euo pipefail
          # m025-44: the shipped English engine is supertonic-3 (m025-42 replaced the
          # sherpa-vits substrate). In m025-49 this engine is the offline/cloud-failure
          # fallback, so the proof still pins exactly the bytes that offline users run.
          cd vendor/supertonic-3
          shasum -a 256 sherpa-onnx-wasm-main-tts.wasm sherpa-onnx-wasm-main-tts.js \
            sherpa-onnx-tts.js sherpa-onnx-tts.worker.js \
            vector_estimator.int8.onnx vocoder.int8.onnx \
            | tee ../../m02526-runtime-sha256.txt
          # Must equal the manifest recorded when this substrate was vendored.
          grep -q '325adfe564122ca2766fe0902b22c780f61a362f5d36b0c364b1c3e34db932fe' ../../m02526-runtime-sha256.txt
          grep -q '6ded938a274ad01f2d786ceda2dfcac49dd5e3ffffe1dc81fed9e3a13b70eaa3' ../../m02526-runtime-sha256.txt
          grep -q '20cd86fa5c6effedfda0e7cffe5b0569ca401c440a0c3a1d72bf39286c0db3fd' ../../m02526-runtime-sha256.txt
          grep -q 'e923d60f53f95eb1ce235f1dc33ec56d9c057823c96fa6f8acf98f32b0da6152' ../../m02526-runtime-sha256.txt

      - name: Create product-runtime probe page
        shell: bash
        run: |
          set -euo pipefail
          cat > m02526-probe.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>m025-26 product neural proof</title>
          <script>window.FIEZEL_VERSION='5.19.0';</script>
          <script src="./features/neural-voice/fiezel-neural-voice-config.js"></script>
          <script src="./features/neural-voice/fiezel-kokoro-adapter.js"></script>
          <script src="./features/neural-voice/fiezel-voice-persona.js"></script>
          <script src="./features/neural-voice/fiezel-sherpa-vits-adapter.js"></script>
          <script src="./features/neural-voice/fiezel-neural-voice.js"></script>
          <script src="./features/neural-voice/fiezel-web-audio-player.js"></script>
          <script src="./features/neural-voice/fiezel-neural-voice-bootstrap.js"></script>
          <script src="./features/neural-voice/fiezel-puter-tts-provider.js"></script>
          <script>
          (()=>{
            const r={phase:'boot',engine:null,plays:[],errors:[],usedBrowserTts:false};
            window.__probeStatus='boot';window.__probeResult=null;
            // Any SpeechSynthesis use is a hard failure: OWNER requires neural, never browser TTS.
            try{const realSpeak=speechSynthesis.speak.bind(speechSynthesis);
              speechSynthesis.speak=u=>{const t=String(u&&u.text||'');if(t.trim()){r.usedBrowserTts=true}return realSpeak(u)}}catch(_){}
            let last=performance.now(),maxDrift=0,ticks=0;
            const timer=setInterval(()=>{const n=performance.now();maxDrift=Math.max(maxDrift,n-last-100);last=n;ticks++},100);
            const finish=(ok,e)=>{clearInterval(timer);r.success=ok;r.eventLoop={maxTickDriftMs:Math.round(Math.max(0,maxDrift)),tickCount:ticks};
              if(e){r.errors.push(String(e&&e.message||e))}window.__probeStatus=ok?'done':'error';window.__probeResult=r};
            const to=(p,ms,l)=>Promise.race([p,new Promise((_,rj)=>setTimeout(()=>rj(new Error(l+' timeout '+ms)),ms))]);
            (async()=>{
              const rt=window.FiezelVoiceRuntime;
              if(!rt)throw new Error('FiezelVoiceRuntime missing');
              // 1. one explicit download, as if the user pressed the button once
              const dlStart=performance.now();
              await to(rt.prepare(),900000,'prepare');
              r.prepareMs=Math.round(performance.now()-dlStart);
              const st=rt.status();
              r.engine=st.engine;r.engineModel=st.engineModel;r.totalBytes=st.totalBytes;r.assetCount=st.assetCount;r.primaryProvider=st.primaryProvider;r.activeProvider=st.activeProvider;
              r.prepared=st.prepared;r.storage=st.storage;
              // 2. capture audio instead of playing it, so we can measure real sample output
              const captured=[];
              const player=window.FiezelWebAudioPlayer.createPlayer(window);
              const realPlay=player.play;
              // 3. first + warm generations through the real voice service
              const speak=async(label,text)=>{
                const t0=performance.now();
                const res=await to(rt.speak(text,{allowFallback:false}),300000,label);
                const ms=performance.now()-t0;
                r.plays.push({label,ms:Math.round(ms),provider:String(res&&res.provider||''),voice:String(res&&res.voice||'')});
                return ms;
              };
              await speak('first','Neural voice readiness check for FIEZEL.');
              await speak('warm-1','Neural voice readiness check for FIEZEL.');
              await speak('warm-2','A second sentence to confirm stable warm latency.');
              const after=rt.status();
              r.circuitOpen=after.circuitOpen;r.lastFallbackReason=after.lastFallbackReason;r.readyAfter=after.ready;
              // Direct proof of download-once: sum bytes actually pulled over the network
              // for the engine payload this visit. A timing ratio only hints; transferSize
              // states it. A cache-served asset reports transferSize 0.
              try{
                const eng=performance.getEntriesByType('resource').filter(e=>e.name.indexOf('/vendor/supertonic-3/')!==-1);
                r.engineRequests=eng.length;
                r.engineTransferBytes=eng.reduce((s,e)=>s+(Number(e.transferSize)||0),0);
                r.engineDecodedBytes=eng.reduce((s,e)=>s+(Number(e.decodedBodySize)||0),0);
              }catch(_){r.engineTransferBytes=null}
              finish(true);
            })().catch(e=>finish(false,e));
          })();
          </script>
          HTML

      - name: Start local server and SafariDriver
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 >/tmp/m02526-http.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS "http://127.0.0.1:8000/m02526-probe.html" >/dev/null 2>&1 && break; sleep 1; done
          sudo /usr/bin/safaridriver --enable || true
          /usr/bin/safaridriver -p 4444 >/tmp/m02526-safaridriver.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:4444/status >/dev/null 2>&1 && break; sleep 1; done

      - name: Run product neural proof
        shell: bash
        run: |
          set -euo pipefail
          sj="$(curl -fsS -H 'Content-Type: application/json' -d '{"capabilities":{"alwaysMatch":{"browserName":"safari"}}}' http://127.0.0.1:4444/session)"
          sid="$(echo "$sj" | jq -r '.value.sessionId // .sessionId // empty')"; test -n "$sid"
          nav(){ curl -fsS -H 'Content-Type: application/json' -d "{\"url\":\"$1\"}" "http://127.0.0.1:4444/session/$sid/url" >/dev/null; }
          poll(){
            for i in $(seq 1 900); do
              resp="$(curl -fsS -H 'Content-Type: application/json' -d '{"script":"return {status:window.__probeStatus||null,result:window.__probeResult||null};","args":[]}' "http://127.0.0.1:4444/session/$sid/execute/sync" 2>/dev/null || true)"
              s="$(echo "$resp" | jq -r '.value.status // empty' 2>/dev/null || true)"
              if [[ "$s" == done || "$s" == error ]]; then echo "$resp" | jq -c '.value.result'; return 0; fi
              sleep 1
            done
            return 1
          }
          nav "http://127.0.0.1:8000/m02526-probe.html"
          poll > m02526-run1.json
          # Second visit proves the cached engine is reused: no re-download on reload.
          nav "http://127.0.0.1:8000/m02526-probe.html"
          poll > m02526-run2.json
          curl -fsS -X DELETE "http://127.0.0.1:4444/session/$sid" >/dev/null || true
          jq . m02526-run1.json | tee m02526-run1-pretty.json
          jq . m02526-run2.json | tee m02526-run2-pretty.json

      - name: Assert OWNER acceptance properties
        shell: bash
        run: |
          set -euo pipefail
          # neural actually ran, and browser TTS never spoke
          jq -e '.success==true' m02526-run1.json >/dev/null
          jq -e '.usedBrowserTts==false' m02526-run1.json >/dev/null
          jq -e '.usedBrowserTts==false' m02526-run2.json >/dev/null
          jq -e '.engine=="supertonic-3"' m02526-run1.json >/dev/null
          jq -e '.primaryProvider=="puter-cloud" and .activeProvider=="supertonic-3"' m02526-run1.json >/dev/null
          jq -e '(.plays|length)==3' m02526-run1.json >/dev/null
          jq -e '[.plays[].provider]|all(.!="browser-speech-synthesis")' m02526-run1.json >/dev/null
          # no latched failure state
          jq -e '.circuitOpen==false and .lastFallbackReason=="" and .readyAfter==true' m02526-run1.json >/dev/null
          # m025-49 role correction. The old <7s warm threshold measured Supertonic as
          # the PRIMARY engine. OWNER explicitly replaced that architecture after device
          # evidence showed Supertonic cannot sustain realtime (median RTF 2.294). On this
          # signed-out runner Supertonic is now only the offline/cloud-failure fallback.
          # Keep a hard anti-hang ceiling instead of pretending the fallback meets the
          # Puter primary latency target: every local utterance must complete <15s, the
          # circuit must stay healthy, and the cache/download assertions below stay strict.
          jq -e '[.plays[].ms]|all(.<15000)' m02526-run1.json >/dev/null
          jq -e '[.plays[].ms]|all(.<15000)' m02526-run2.json >/dev/null
          # download-once: second visit must not re-run the download path
          jq -e '.prepared==true and .storage=="cache"' m02526-run2.json >/dev/null
          r1="$(jq -r '.prepareMs' m02526-run1.json)"; r2="$(jq -r '.prepareMs' m02526-run2.json)"
          b1="$(jq -r '.engineTransferBytes' m02526-run1.json)"; b2="$(jq -r '.engineTransferBytes' m02526-run2.json)"
          echo "prepareMs cold=$r1 cached=$r2 | engine bytes over network: cold=$b1 cached=$b2"
          # The decisive check is bytes, not milliseconds. The first visit must actually
          # pull the full fallback payload; the second must pull essentially nothing because
          # the payload is served from the stable neural cache.
          jq -e '.engineTransferBytes > 90000000' m02526-run1.json >/dev/null
          jq -e '.engineTransferBytes < 1000000' m02526-run2.json >/dev/null
          echo "ALL SIGNED-OUT FALLBACK ACCEPTANCE PROPERTIES PASS"

      - name: Upload product neural evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m02526-product-neural-${{ github.sha }}
          path: |
            m02526-run1.json
            m02526-run2.json
            m02526-run1-pretty.json
            m02526-run2-pretty.json
            m02526-runtime-sha256.txt
            m02526-sw-vers.txt
            m02526-safaridriver-version.txt
            m02526-arch.txt
            /tmp/m02526-http.log
            /tmp/m02526-safaridriver.log
          if-no-files-found: warn
          retention-days: 30
